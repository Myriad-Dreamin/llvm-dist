name: Build LLVM Artifacts

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag with v prefix (e.g. v21.1.8)
        default: v21.1.8
        required: true
        type: string
      publish_release:
        description: Upload artifacts to a GitHub Release
        default: false
        required: true
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: llvm-artifacts-${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.release_tag || github.ref_name || 'v21.1.8' }}
  cancel-in-progress: false

env:
  LLVM_VERSION: ${{ github.event.inputs.release_tag || github.ref_name || 'v21.1.8' }}
  CCACHE_DIR: ${{ github.workspace }}/.cache/ccache

jobs:
  build-linux-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target_triple: x86_64-unknown-linux-gnu
            build_type: release
          - os: ubuntu-24.04
            target_triple: x86_64-unknown-linux-gnu
            build_type: relwithdebinfo
    runs-on: ${{ matrix.os }}
    name: llvm-${{ github.event.inputs.release_tag || github.ref_name || 'v21.1.8' }}-${{ matrix.build_type }}-${{ matrix.target_triple }}
    env:
      SCRIPT_C_COMPILER: clang
      SCRIPT_CXX_COMPILER: clang++

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install LLVM build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld cmake ninja-build ccache xz-utils

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ matrix.build_type }}-${{ env.LLVM_VERSION }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ matrix.build_type }}-${{ env.LLVM_VERSION }}-
            ccache-${{ runner.os }}-${{ matrix.build_type }}-

      - name: Fetch LLVM source
        run: |
          git clone --filter=blob:none --branch "llvmorg-${LLVM_VERSION#v}" --single-branch https://github.com/llvm/llvm-project.git llvm-mainline
          git -C llvm-mainline fetch --force --depth=1 origin "refs/tags/llvmorg-${LLVM_VERSION#v}:refs/tags/llvmorg-${LLVM_VERSION#v}"
          git -C llvm-mainline tag --list "llvmorg-${LLVM_VERSION#v}"

      - name: Reset ccache stats
        run: ccache --zero-stats

      - name: Configure LLVM
        run: |
          pnpm llvm init \
            --llvm-dir llvm-mainline \
            --allow "${LLVM_VERSION#v}" \
            --build-types "${{ matrix.build_type }}" \
            --target-triples "${{ matrix.target_triple }}" \
            --ccache \
            --ccache-dir "${CCACHE_DIR}" \
            --jobs "$(nproc)"

      - name: Build and install distribution
        run: |
          pnpm llvm install \
            --llvm-dir llvm-mainline \
            --allow "${LLVM_VERSION#v}" \
            --build-types "${{ matrix.build_type }}" \
            --target-triples "${{ matrix.target_triple }}" \
            --ccache \
            --ccache-dir "${CCACHE_DIR}" \
            --jobs "$(nproc)"

      - name: Package artifact
        run: |
          pnpm llvm package \
            --llvm-dir llvm-mainline \
            --allow "${LLVM_VERSION#v}" \
            --build-types "${{ matrix.build_type }}" \
            --artifact-dir artifacts \
            --package-prefix llvm-dist \
            --target-triples "${{ matrix.target_triple }}" \
            --package-target-triple "${{ matrix.target_triple }}"

      - name: Show ccache stats
        if: always()
        run: ccache --show-stats

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: llvm-dist-${{ github.event.inputs.release_tag || github.ref_name || 'v21.1.8' }}-${{ matrix.build_type }}-${{ matrix.target_triple }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

  build-linux-cross:
    strategy:
      fail-fast: false
      matrix:
        target_triple:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-gnu
          - arm-unknown-linux-musleabihf
          - armv7-unknown-linux-musleabihf
          - riscv64gc-unknown-linux-musl
          - loongarch64-unknown-linux-musl
        build_type: [release, relwithdebinfo]
        include:
          - target_triple: x86_64-unknown-linux-musl
            cmake_system_processor: x86_64
          - target_triple: aarch64-unknown-linux-gnu
            cmake_system_processor: aarch64
          - target_triple: arm-unknown-linux-musleabihf
            cmake_system_processor: arm
          - target_triple: armv7-unknown-linux-musleabihf
            cmake_system_processor: armv7
          - target_triple: riscv64gc-unknown-linux-musl
            cmake_system_processor: riscv64
          - target_triple: loongarch64-unknown-linux-musl
            cmake_system_processor: loongarch64
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cross-rs/${{ matrix.target_triple }}:edge
      options: --user root
    name: llvm-${{ github.event.inputs.release_tag || github.ref_name || 'v21.1.8' }}-${{ matrix.build_type }}-${{ matrix.target_triple }}
    env:
      SCRIPT_CMAKE_EXTRA_ARGS: >-
        -DCMAKE_SYSTEM_NAME=Linux
        -DCMAKE_SYSTEM_PROCESSOR=${{ matrix.cmake_system_processor }}
        -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY
        -DLLVM_HOST_TRIPLE=${{ matrix.target_triple }}
        -DLLVM_DEFAULT_TARGET_TRIPLE=${{ matrix.target_triple }}
        -DLLVM_TABLEGEN=${{ github.workspace }}/llvm-native-tools/bin/llvm-tblgen
        -DCLANG_TABLEGEN=${{ github.workspace }}/llvm-native-tools/bin/clang-tblgen
        -DMLIR_TABLEGEN=${{ github.workspace }}/llvm-native-tools/bin/mlir-tblgen
        -DLLVM_ENABLE_ZLIB=OFF
        -DLLVM_ENABLE_ZSTD=OFF

    steps:
      - name: Install container dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            bash ca-certificates clang cmake g++ git lld ninja-build ccache tar xz-utils python3

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch LLVM source
        run: |
          git clone --filter=blob:none --branch "llvmorg-${LLVM_VERSION#v}" --single-branch https://github.com/llvm/llvm-project.git llvm-mainline
          git -C llvm-mainline fetch --force --depth=1 origin "refs/tags/llvmorg-${LLVM_VERSION#v}:refs/tags/llvmorg-${LLVM_VERSION#v}"
          git -C llvm-mainline tag --list "llvmorg-${LLVM_VERSION#v}"

      - name: Build native tablegen tools
        run: |
          cmake -S llvm-mainline/llvm -B llvm-native-tools -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_PROJECTS="clang;mlir" \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_TARGETS_TO_BUILD=Native
          cmake --build llvm-native-tools --target llvm-tblgen clang-tblgen mlir-tblgen --parallel "$(nproc)"

      - name: Resolve cross compilers
        shell: bash
        run: |
          target="${{ matrix.target_triple }}"
          target_env="$(printf '%s' "$target" | tr '[:lower:]-' '[:upper:]_')"
          target_env_lower="$(printf '%s' "$target" | tr '-' '_')"

          resolve_tool() {
            local tool="$1"
            if [[ -z "$tool" ]]; then
              return 1
            fi

            if [[ "$tool" == */* ]]; then
              if [[ ! -x "$tool" ]]; then
                return 1
              fi
              readlink -f "$tool" 2>/dev/null || realpath "$tool" 2>/dev/null || printf '%s\n' "$tool"
              return 0
            fi

            command -v "$tool"
          }

          selected_c=""
          selected_cxx=""
          selected_needs_target="0"

          try_pair() {
            local c="$1"
            local cxx="$2"
            local needs_target="${3:-0}"
            local c_path=""
            local cxx_path=""

            c_path="$(resolve_tool "$c")" || return 1
            cxx_path="$(resolve_tool "$cxx")" || return 1

            selected_c="$c_path"
            selected_cxx="$cxx_path"
            selected_needs_target="$needs_target"
            return 0
          }

          try_linker_pair() {
            local linker="$1"
            if [[ -z "$linker" ]]; then
              return 1
            fi

            if [[ "$linker" == *gcc ]]; then
              try_pair "$linker" "${linker%gcc}g++" 0
              return $?
            fi

            if [[ "$linker" == *cc ]]; then
              try_pair "$linker" "${linker%cc}c++" 0
              return $?
            fi

            if [[ "$linker" == *clang ]]; then
              try_pair "$linker" "${linker}++" 1
              return $?
            fi

            return 1
          }

          try_env_pair() {
            local cc_var="$1"
            local cxx_var="$2"
            local cc_value="${!cc_var:-}"
            local cxx_value="${!cxx_var:-}"

            if [[ -z "$cc_value" || -z "$cxx_value" ]]; then
              return 1
            fi

            try_pair "$cc_value" "$cxx_value" 0
          }

          try_known_pairs() {
            case "$target" in
              x86_64-unknown-linux-musl)
                try_pair x86_64-linux-musl-gcc x86_64-linux-musl-g++ 0 && return 0
                try_pair x86_64-unknown-linux-musl-gcc x86_64-unknown-linux-musl-g++ 0 && return 0
                ;;
              aarch64-unknown-linux-gnu)
                try_pair aarch64-linux-gnu-gcc aarch64-linux-gnu-g++ 0 && return 0
                try_pair aarch64-unknown-linux-gnu-gcc aarch64-unknown-linux-gnu-g++ 0 && return 0
                ;;
              arm-unknown-linux-musleabihf)
                try_pair arm-linux-musleabihf-gcc arm-linux-musleabihf-g++ 0 && return 0
                try_pair arm-unknown-linux-musleabihf-gcc arm-unknown-linux-musleabihf-g++ 0 && return 0
                ;;
              armv7-unknown-linux-musleabihf)
                try_pair arm-linux-musleabihf-gcc arm-linux-musleabihf-g++ 0 && return 0
                try_pair armv7-linux-musleabihf-gcc armv7-linux-musleabihf-g++ 0 && return 0
                try_pair armv7-unknown-linux-musleabihf-gcc armv7-unknown-linux-musleabihf-g++ 0 && return 0
                ;;
              riscv64gc-unknown-linux-musl)
                try_pair riscv64gc-unknown-linux-musl-gcc riscv64gc-unknown-linux-musl-g++ 0 && return 0
                try_pair riscv64-unknown-linux-musl-gcc riscv64-unknown-linux-musl-g++ 0 && return 0
                try_pair riscv64-linux-musl-gcc riscv64-linux-musl-g++ 0 && return 0
                ;;
              loongarch64-unknown-linux-musl)
                try_pair loongarch64-unknown-linux-musl-gcc loongarch64-unknown-linux-musl-g++ 0 && return 0
                try_pair loongarch64-linux-musl-gcc loongarch64-linux-musl-g++ 0 && return 0
                ;;
            esac

            return 1
          }

          cargo_linker_var="CARGO_TARGET_${target_env}_LINKER"

          try_env_pair "CC_${target_env}" "CXX_${target_env}" ||
            try_env_pair "CC_${target_env_lower}" "CXX_${target_env_lower}" ||
            try_linker_pair "${!cargo_linker_var:-}" ||
            try_known_pairs ||
            try_pair clang clang++ 1 || {
              echo "::error::No C/C++ compiler pair found for ${target}"
              env | sort | grep -E '^(CC|CXX|CARGO_TARGET_.*_LINKER)=' || true
              exit 1
            }

          extra_cmake_args="${SCRIPT_CMAKE_EXTRA_ARGS:-}"
          if [[ "$selected_needs_target" == "1" ]]; then
            extra_cmake_args="${extra_cmake_args} -DCMAKE_C_COMPILER_TARGET=${target} -DCMAKE_CXX_COMPILER_TARGET=${target} -DCMAKE_ASM_COMPILER_TARGET=${target}"
          fi

          {
            echo "SCRIPT_C_COMPILER=${selected_c}"
            echo "SCRIPT_CXX_COMPILER=${selected_cxx}"
            echo "SCRIPT_ASM_COMPILER=${selected_c}"
            echo "SCRIPT_CMAKE_EXTRA_ARGS=${extra_cmake_args}"
          } >>"${GITHUB_ENV}"

          echo "C compiler: ${selected_c}"
          echo "CXX compiler: ${selected_cxx}"
          echo "ASM compiler: ${selected_c}"
          echo "extra CMake args: ${extra_cmake_args}"

      - name: Reset ccache stats
        run: ccache --zero-stats

      - name: Configure LLVM
        run: |
          pnpm llvm init \
            --llvm-dir llvm-mainline \
            --allow "${LLVM_VERSION#v}" \
            --build-types "${{ matrix.build_type }}" \
            --target-triples "${{ matrix.target_triple }}" \
            --ccache \
            --ccache-dir "${CCACHE_DIR}" \
            --jobs "$(nproc)"

      - name: Build and install distribution
        run: |
          pnpm llvm install \
            --llvm-dir llvm-mainline \
            --allow "${LLVM_VERSION#v}" \
            --build-types "${{ matrix.build_type }}" \
            --target-triples "${{ matrix.target_triple }}" \
            --ccache \
            --ccache-dir "${CCACHE_DIR}" \
            --jobs "$(nproc)"

      - name: Package artifact
        run: |
          pnpm llvm package \
            --llvm-dir llvm-mainline \
            --allow "${LLVM_VERSION#v}" \
            --build-types "${{ matrix.build_type }}" \
            --artifact-dir artifacts \
            --package-prefix llvm-dist \
            --target-triples "${{ matrix.target_triple }}" \
            --package-target-triple "${{ matrix.target_triple }}"

      - name: Show ccache stats
        if: always()
        run: ccache --show-stats

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: llvm-dist-${{ github.event.inputs.release_tag || github.ref_name || 'v21.1.8' }}-${{ matrix.build_type }}-${{ matrix.target_triple }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

  build-darwin:
    strategy:
      fail-fast: false
      matrix:
        target_triple:
          - x86_64-apple-darwin
          - aarch64-apple-darwin
        build_type: [release, relwithdebinfo]
        include:
          - runner: macos-15-intel
            target_triple: x86_64-apple-darwin
          - runner: macos-15
            target_triple: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    name: llvm-${{ github.event.inputs.release_tag || github.ref_name || 'v21.1.8' }}-${{ matrix.build_type }}-${{ matrix.target_triple }}
    env:
      SCRIPT_C_COMPILER: clang
      SCRIPT_CXX_COMPILER: clang++

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install LLVM build dependencies
        run: brew install ninja ccache xz zstd

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ matrix.build_type }}-${{ env.LLVM_VERSION }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ matrix.build_type }}-${{ env.LLVM_VERSION }}-
            ccache-${{ runner.os }}-${{ matrix.build_type }}-

      - name: Fetch LLVM source
        run: |
          git clone --filter=blob:none --branch "llvmorg-${LLVM_VERSION#v}" --single-branch https://github.com/llvm/llvm-project.git llvm-mainline
          git -C llvm-mainline fetch --force --depth=1 origin "refs/tags/llvmorg-${LLVM_VERSION#v}:refs/tags/llvmorg-${LLVM_VERSION#v}"
          git -C llvm-mainline tag --list "llvmorg-${LLVM_VERSION#v}"

      - name: Reset ccache stats
        run: ccache --zero-stats

      - name: Configure LLVM
        run: |
          pnpm llvm init \
            --llvm-dir llvm-mainline \
            --allow "${LLVM_VERSION#v}" \
            --build-types "${{ matrix.build_type }}" \
            --target-triples "${{ matrix.target_triple }}" \
            --ccache \
            --ccache-dir "${CCACHE_DIR}" \
            --jobs "$(sysctl -n hw.ncpu)"

      - name: Build and install distribution
        run: |
          pnpm llvm install \
            --llvm-dir llvm-mainline \
            --allow "${LLVM_VERSION#v}" \
            --build-types "${{ matrix.build_type }}" \
            --target-triples "${{ matrix.target_triple }}" \
            --ccache \
            --ccache-dir "${CCACHE_DIR}" \
            --jobs "$(sysctl -n hw.ncpu)"

      - name: Package artifact
        run: |
          pnpm llvm package \
            --llvm-dir llvm-mainline \
            --allow "${LLVM_VERSION#v}" \
            --build-types "${{ matrix.build_type }}" \
            --artifact-dir artifacts \
            --package-prefix llvm-dist \
            --target-triples "${{ matrix.target_triple }}" \
            --package-target-triple "${{ matrix.target_triple }}"

      - name: Show ccache stats
        if: always()
        run: ccache --show-stats

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: llvm-dist-${{ github.event.inputs.release_tag || github.ref_name || 'v21.1.8' }}-${{ matrix.build_type }}-${{ matrix.target_triple }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

  build-windows:
    strategy:
      fail-fast: false
      matrix:
        target_triple:
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
        build_type: [release, relwithdebinfo]
        include:
          - runner: windows-2022
            target_triple: x86_64-pc-windows-msvc
            msvc_arch: x64
          - runner: windows-11-arm
            target_triple: aarch64-pc-windows-msvc
            msvc_arch: arm64
    runs-on: ${{ matrix.runner }}
    name: llvm-${{ github.event.inputs.release_tag || github.ref_name || 'v21.1.8' }}-${{ matrix.build_type }}-${{ matrix.target_triple }}
    env:
      SCRIPT_C_COMPILER: cl
      SCRIPT_CXX_COMPILER: cl

    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch LLVM source
        shell: bash
        run: |
          git clone --filter=blob:none --branch "llvmorg-${LLVM_VERSION#v}" --single-branch https://github.com/llvm/llvm-project.git llvm-mainline
          git -C llvm-mainline fetch --force --depth=1 origin "refs/tags/llvmorg-${LLVM_VERSION#v}:refs/tags/llvmorg-${LLVM_VERSION#v}"
          git -C llvm-mainline tag --list "llvmorg-${LLVM_VERSION#v}"

      - name: Configure LLVM
        shell: pwsh
        run: |
          $llvmVersion = $env:LLVM_VERSION.TrimStart("v")
          pnpm llvm init `
            --llvm-dir llvm-mainline `
            --allow "$llvmVersion" `
            --build-types "${{ matrix.build_type }}" `
            --target-triples "${{ matrix.target_triple }}" `
            --no-ccache `
            --jobs "$env:NUMBER_OF_PROCESSORS"

      - name: Build and install distribution
        shell: pwsh
        run: |
          $llvmVersion = $env:LLVM_VERSION.TrimStart("v")
          pnpm llvm install `
            --llvm-dir llvm-mainline `
            --allow "$llvmVersion" `
            --build-types "${{ matrix.build_type }}" `
            --target-triples "${{ matrix.target_triple }}" `
            --no-ccache `
            --jobs "$env:NUMBER_OF_PROCESSORS"

      - name: Package artifact
        shell: pwsh
        run: |
          $llvmVersion = $env:LLVM_VERSION.TrimStart("v")
          pnpm llvm package `
            --llvm-dir llvm-mainline `
            --allow "$llvmVersion" `
            --build-types "${{ matrix.build_type }}" `
            --artifact-dir artifacts `
            --package-prefix llvm-dist `
            --target-triples "${{ matrix.target_triple }}" `
            --package-target-triple "${{ matrix.target_triple }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: llvm-dist-${{ github.event.inputs.release_tag || github.ref_name || 'v21.1.8' }}-${{ matrix.build_type }}-${{ matrix.target_triple }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

  descriptor:
    needs:
      - build-linux-native
      - build-linux-cross
      - build-darwin
      - build-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: llvm-dist-${{ env.LLVM_VERSION }}-*
          path: artifacts
          merge-multiple: true

      - name: Generate descriptor and checksums
        run: |
          pnpm llvm descriptor \
            --artifact-dir artifacts \
            --package-prefix llvm-dist \
            --descriptor-name descriptor.json

      - name: Upload descriptor
        uses: actions/upload-artifact@v4
        with:
          name: llvm-dist-${{ github.event.inputs.release_tag || github.ref_name || 'v21.1.8' }}-descriptor
          path: |
            artifacts/descriptor.json
            artifacts/descriptor.json.sha256
            artifacts/*.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release artifacts
        if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: artifacts/*
